[build-system]
requires = ["briefcase"]
build-backend = "briefcase.integrations.setuptools"

[project]
name = "azadiconnect"
version = "0.3.3"
description = "Secure P2P censorship-resistant chat for users in Iran"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AzadiConnect Team", email = "team@azadiconnect.org"}
]
keywords = ["chat", "p2p", "encryption", "tor", "censorship", "iran", "toga", "beeware"]
# Global dependencies must be empty to avoid android conflicts
dependencies = []

[project.urls]
Homepage = "https://github.com/azadiconnect/azadiconnect"

# =============================================================================
# Briefcase Configuration
# =============================================================================
[tool.briefcase]
project_name = "AzadiConnect"
bundle = "org.azadiconnect"
version = "0.3.3"
url = "https://github.com/azadiconnect/azadiconnect"
license.file = "LICENSE"
author = "AzadiConnect Team"
author_email = "team@azadiconnect.org"

[tool.briefcase.app.azadiconnect]
formal_name = "AzadiConnect"
description = "Secure P2P censorship-resistant chat application"
long_description = """A secure, peer-to-peer chat application designed for users under censorship. 
Features end-to-end encryption, Tor integration, and bilingual (English/Farsi) support."""
# icon = "icons/azadiconnect"
sources = ["src/azadiconnect"]
test_sources = ["tests"]
# Common requirements - cryptography only (has iOS wheels)
# stem/pysocks are platform-specific (desktop only, no iOS)
requires = ["cryptography", "aiosqlite"]

# =============================================================================
# Linux Configuration
# =============================================================================
[tool.briefcase.app.azadiconnect.linux]
requires = [
    # Pin Toga to the stable 0.4.x series
    "toga-gtk>=0.4.6",
    
    # CRITICAL FIX: 
    # 1. Must be >= 3.46.0 to satisfy Toga 0.4.4
    # 2. Must be < 3.48.0 to avoid 'girepository-2.0' error
    "pygobject>=3.46.0,<3.48.0",
    
    # Tor dependencies (desktop only)
    "stem",
    "pysocks",
]
system_requires = [
    "libgirepository1.0-dev",
    "libcairo2-dev",
    "gir1.2-gtk-3.0",
]

[tool.briefcase.app.azadiconnect.linux.appimage]
# Use AlmaLinux 9 (GLib 2.68) which satisfies the requirement for GLib >= 2.64
manylinux = "manylinux_2_34"

# Red Hat package names for the Docker container
system_requires = [
    "fuse-libs",
    "cairo-devel",
    "cairo-gobject-devel",
    "gobject-introspection-devel",
]

# =============================================================================
# Windows Configuration
# =============================================================================
[tool.briefcase.app.azadiconnect.windows]
requires = [
    "toga-winforms>=0.4.0",
    # Tor dependencies (desktop only)
    "stem",
    "pysocks",
]

# =============================================================================
# macOS Configuration
# =============================================================================
[tool.briefcase.app.azadiconnect.macOS]
requires = [
    "toga-cocoa>=0.4.0",
    # Tor dependencies (desktop only)
    "stem",
    "pysocks",
]
universal_build = true

# =============================================================================
# iOS Configuration
# =============================================================================
[tool.briefcase.app.azadiconnect.iOS]
# iOS: NO stem/pysocks - cannot spawn Tor subprocess in iOS sandbox
requires = ["toga-iOS>=0.4.0"]

# =============================================================================
# Android Configuration
# =============================================================================
[tool.briefcase.app.azadiconnect.android]
# Android: Include Tor deps for future Orbot integration
requires = [
    "toga-android>=0.4.0",
    # Note: May need Orbot for actual Tor functionality
    "stem",
    "pysocks",
]
base_theme = "Theme.MaterialComponents.Light.DarkActionBar"
build_gradle_dependencies = ["com.google.android.material:material:1.11.0"]
splash_background_color = "#FFFFFF"
